<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const state = {
  layers: [
    { type: 'input',  nodes: 4, color: '#00d4ff', name: 'Input' },
    { type: 'hidden', nodes: 8, color: '#7c3aed', name: 'Hidden 1' },
    { type: 'hidden', nodes: 6, color: '#f59e0b', name: 'Hidden 2' },
    { type: 'output', nodes: 2, color: '#00f5a0', name: 'Output' },
  ],
  weights: [],
  biases: [],
  activations: [],
  gradients: [],
  training: false,
  epoch: 0,
  loss: null,
  acc: null,
  lossHistory: [],
  accHistory: [],
  gradHistory: [],
  lr: 0.01,
  batchSize: 32,
  speed: 3,
  activation: 'relu',
  lossType: 'mse',
  animFrame: null,
  pulseTime: 0,
  forwardPulse: null,
  selectedLayer: null,
  trainInterval: null,
};

const LAYER_COLORS = ['#00d4ff','#7c3aed','#f59e0b','#ff4d6d','#00f5a0','#f472b6','#34d399'];

// ═══════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('nn-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const area = canvas.parentElement;
  const w = area.clientWidth - 40;
  const h = area.clientHeight - 100;
  canvas.width  = Math.min(w, 800);
  canvas.height = Math.max(400, Math.min(h, 600));
  drawNetwork();
}

// ═══════════════════════════════════════════════════════
// INIT WEIGHTS
// ═══════════════════════════════════════════════════════
function initWeights() {
  state.weights = [];
  state.biases = [];
  state.activations = [];
  for (let i = 0; i < state.layers.length - 1; i++) {
    const rows = state.layers[i+1].nodes;
    const cols = state.layers[i].nodes;
    const w = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        row.push((Math.random() * 2 - 1) * Math.sqrt(2 / cols));
      }
      w.push(row);
    }
    state.weights.push(w);
    state.biases.push(new Array(rows).fill(0).map(() => (Math.random()-0.5)*0.1));
  }
  state.activations = state.layers.map(l => new Array(l.nodes).fill(0).map(() => Math.random()));
  updateNetInfo();
  updateHistogram();
}

// ═══════════════════════════════════════════════════════
// NETWORK GEOMETRY
// ═══════════════════════════════════════════════════════
function getLayerPositions() {
  const W = canvas.width, H = canvas.height;
  const pad = 60;
  const cols = state.layers.length;
  const positions = [];
  for (let l = 0; l < cols; l++) {
    const x = pad + (l / (cols - 1)) * (W - pad * 2);
    const nodes = [];
    const n = state.layers[l].nodes;
    const maxShow = 12;
    const show = Math.min(n, maxShow);
    const spacing = Math.min(48, (H - 80) / (show + 1));
    for (let i = 0; i < show; i++) {
      const y = H/2 + (i - (show-1)/2) * spacing;
      nodes.push({ x, y, real: i, hidden: n > maxShow && i === show - 1 });
    }
    if (n > maxShow) {
      nodes[nodes.length-1].hidden = true;
      nodes[nodes.length-1].hiddenCount = n - maxShow + 1;
    }
    positions.push(nodes);
  }
  return positions;
}

// ═══════════════════════════════════════════════════════
// DRAW NETWORK
// ═══════════════════════════════════════════════════════
function drawNetwork() {
  if (!canvas.width) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const pos = getLayerPositions();
  const t = state.pulseTime;

  // DRAW CONNECTIONS
  for (let l = 0; l < pos.length - 1; l++) {
    const fromNodes = pos[l];
    const toNodes = pos[l+1];
    const fromColor = state.layers[l].color;
    const toColor = state.layers[l+1].color;

    for (let fi = 0; fi < fromNodes.length; fi++) {
      for (let ti = 0; ti < toNodes.length; ti++) {
        const from = fromNodes[fi];
        const to   = toNodes[ti];
        const wVal = state.weights[l] ? (state.weights[l][ti] ? state.weights[l][ti][fi] : 0) : 0;
        const absW = Math.abs(wVal);

        // Base connection
        const alpha = 0.04 + absW * 0.18;
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.lineWidth = 0.5 + absW * 1.5;
        ctx.strokeStyle = wVal > 0
          ? `rgba(0,212,255,${alpha})`
          : `rgba(255,77,109,${alpha})`;
        ctx.stroke();

        // Pulse animation (forward pass)
        if (state.forwardPulse !== null && state.forwardPulse === l) {
          const pulsePos = (t % 1);
          const px = from.x + (to.x - from.x) * pulsePos;
          const py = from.y + (to.y - from.y) * pulsePos;
          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,212,255,${0.7 * (1 - Math.abs(pulsePos - 0.5) * 2)})`;
          ctx.fill();
        }
      }
    }
  }

  // DRAW NODES
  for (let l = 0; l < pos.length; l++) {
    const layer = state.layers[l];
    const nodes = pos[l];
    const color = layer.color;

    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const act = state.activations[l] ? (state.activations[l][i] || 0) : 0;
      const r = 14;

      if (n.hidden) {
        // Ellipsis node
        ctx.fillStyle = 'rgba(100,116,139,0.5)';
        for (let d = -1; d <= 1; d++) {
          ctx.beginPath();
          ctx.arc(n.x, n.y + d * 7, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'var(--muted)';
        ctx.font = '9px Space Mono';
        ctx.textAlign = 'center';
        ctx.fillText(`+${n.hiddenCount}`, n.x, n.y + 20);
        continue;
      }

      // Glow
      const glowSize = r + 8 + act * 12;
      const grd = ctx.createRadialGradient(n.x, n.y, r * 0.5, n.x, n.y, glowSize);
      grd.addColorStop(0, color + '44');
      grd.addColorStop(1, color + '00');
      ctx.beginPath();
      ctx.arc(n.x, n.y, glowSize, 0, Math.PI * 2);
      ctx.fillStyle = grd;
      ctx.fill();

      // Node circle
      const nodeGrd = ctx.createRadialGradient(n.x - r*0.3, n.y - r*0.3, 2, n.x, n.y, r);
      nodeGrd.addColorStop(0, lightenColor(color, 40));
      nodeGrd.addColorStop(1, color);
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = nodeGrd;
      ctx.fill();

      // Activation ring
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, -Math.PI/2, -Math.PI/2 + act * Math.PI * 2);
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Border
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.strokeStyle = color + 'aa';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Label for first/last
      if (l === 0 || l === state.layers.length - 1) {
        ctx.font = '9px Space Mono';
        ctx.fillStyle = color + 'cc';
        ctx.textAlign = l === 0 ? 'right' : 'left';
        const lx = l === 0 ? n.x - r - 5 : n.x + r + 5;
        ctx.fillText((act * 100).toFixed(0) + '%', lx, n.y + 3);
      }
    }
  }

  // LAYER LABELS
  for (let l = 0; l < pos.length; l++) {
    const layer = state.layers[l];
    const x = pos[l][0].x;
    const topY = Math.min(...pos[l].map(n => n.y)) - 30;
    ctx.font = 'bold 11px Syne';
    ctx.fillStyle = layer.color + 'cc';
    ctx.textAlign = 'center';
    ctx.fillText(layer.name.toUpperCase(), x, topY);
    ctx.font = '10px Space Mono';
    ctx.fillStyle = 'rgba(100,116,139,0.8)';
    ctx.fillText(layer.nodes + ' units', x, topY + 14);
  }
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xff) + amount);
  const b = Math.min(255, (num & 0xff) + amount);
  return `rgb(${r},${g},${b})`;
}

// ═══════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════
let lastTime = 0;
function animate(time) {
  const dt = (time - lastTime) / 1000;
  lastTime = time;

  if (state.training || state.forwardPulse !== null) {
    state.pulseTime += dt * 1.5;
    if (state.pulseTime > 1) {
      state.pulseTime = 0;
      if (state.forwardPulse !== null) {
        state.forwardPulse++;
        if (state.forwardPulse >= state.layers.length - 1) {
          state.forwardPulse = null;
          randomizeActivations();
        }
      }
    }
  }

  // Subtle activation drift when training
  if (state.training) {
    for (let l = 0; l < state.activations.length; l++) {
      for (let i = 0; i < state.activations[l].length; i++) {
        state.activations[l][i] += (Math.random() - 0.5) * 0.05;
        state.activations[l][i] = Math.max(0, Math.min(1, state.activations[l][i]));
      }
    }
  }

  drawNetwork();
  state.animFrame = requestAnimationFrame(animate);
}

// ═══════════════════════════════════════════════════════
// TRAINING SIMULATION
// ═══════════════════════════════════════════════════════
const SPEED_MAP = [50, 30, 20, 10, 5]; // ms per tick

function toggleTraining() {
  state.training = !state.training;
  const btn = document.getElementById('train-btn');
  const icon = document.getElementById('train-icon');
  const text = document.getElementById('train-text');
  const badge = document.getElementById('live-badge');

  if (state.training) {
    btn.classList.add('running');
    icon.textContent = '⏸';
    text.textContent = 'Pause Training';
    badge.textContent = '● Training';
    startTrainingTick();
  } else {
    btn.classList.remove('running');
    icon.textContent = '▶';
    text.textContent = 'Resume Training';
    badge.textContent = 'Paused';
    clearInterval(state.trainInterval);
  }
}

function startTrainingTick() {
  clearInterval(state.trainInterval);
  const ms = SPEED_MAP[state.speed - 1] || 20;
  state.trainInterval = setInterval(trainingStep, ms);
}

function trainingStep() {
  state.epoch++;

  // Simulate loss curve (decaying with noise)
  const baseLoss = 1.2 * Math.exp(-state.epoch * 0.008) + 0.05;
  state.loss = baseLoss + (Math.random() - 0.5) * 0.04;
  state.acc  = Math.min(0.99, 1 - state.loss * 0.7 + (Math.random()-0.5)*0.02);
  const grad = 0.4 * Math.exp(-state.epoch * 0.006) + (Math.random() * 0.1);

  state.lossHistory.push(state.loss);
  state.accHistory.push(state.acc);
  state.gradHistory.push(grad);
  if (state.lossHistory.length > 60) {
    state.lossHistory.shift(); state.accHistory.shift(); state.gradHistory.shift();
  }

  // Perturb weights slightly
  for (let l = 0; l < state.weights.length; l++) {
    for (let r = 0; r < state.weights[l].length; r++) {
      for (let c = 0; c < state.weights[l][r].length; c++) {
        state.weights[l][r][c] += (Math.random()-0.5) * state.lr * 0.5;
      }
    }
  }

  // Update UI
  document.getElementById('ep-display').textContent   = state.epoch;
  document.getElementById('loss-display').textContent = state.loss.toFixed(4);
  document.getElementById('acc-display').textContent  = (state.acc * 100).toFixed(1) + '%';
  document.getElementById('m-loss').textContent = state.loss.toFixed(4);
  document.getElementById('m-acc').textContent  = (state.acc * 100).toFixed(1) + '%';
  document.getElementById('m-grad').textContent = grad.toFixed(4);

  const totalEpochs = 200;
  document.getElementById('prog-bar').style.width = Math.min(100, state.epoch / totalEpochs * 100) + '%';

  drawMiniChart('chart-loss', state.lossHistory, '#ff4d6d');
  drawMiniChart('chart-acc',  state.accHistory,  '#00f5a0');
  drawMiniChart('chart-grad', state.gradHistory,  '#f59e0b');
  updateHistogram();

  if (state.epoch % 50 === 0) {
    showNotif(`Epoch ${state.epoch} — Loss: ${state.loss.toFixed(4)}`);
  }
  if (state.epoch >= totalEpochs) {
    toggleTraining();
    showNotif('✓ Training complete!');
  }
}

function forwardPass() {
  randomizeActivations();
  state.forwardPulse = 0;
  state.pulseTime = 0;
  showNotif('⚡ Forward pass started');
}

function randomizeActivations() {
  state.activations = state.layers.map(l =>
    new Array(l.nodes).fill(0).map(() => Math.max(0, Math.random()))
  );
}

// ═══════════════════════════════════════════════════════
// MINI CHARTS
// ═══════════════════════════════════════════════════════
function drawMiniChart(id, data, color) {
  const c = document.getElementById(id);
  if (!c) return;
  const w = c.offsetWidth || 232; const h = 40;
  c.width = w; c.height = h;
  const cx = c.getContext('2d');

  if (data.length < 2) return;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;

  // Fill
  const grad = cx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '44');
  grad.addColorStop(1, color + '00');
  cx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((data[i] - min) / range) * (h - 4) - 2;
    i === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
  }
  cx.lineTo(w, h); cx.lineTo(0, h);
  cx.closePath();
  cx.fillStyle = grad; cx.fill();

  // Line
  cx.beginPath();
  for (let i = 0; i < data.length; i++) {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((data[i] - min) / range) * (h - 4) - 2;
    i === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
  }
  cx.strokeStyle = color; cx.lineWidth = 1.5; cx.stroke();

  // Dot at end
  const lx = w, ly = h - ((data[data.length-1] - min) / range) * (h-4) - 2;
  cx.beginPath(); cx.arc(lx - 2, ly, 3, 0, Math.PI*2);
  cx.fillStyle = color; cx.fill();
}

// ═══════════════════════════════════════════════════════
// HISTOGRAM
// ═══════════════════════════════════════════════════════
function updateHistogram() {
  const c = document.getElementById('hist-canvas');
  if (!c) return;
  const w = c.offsetWidth || 232; const h = 70;
  c.width = w; c.height = h;
  const cx = c.getContext('2d');

  const allWeights = [];
  for (const layer of state.weights) {
    for (const row of layer) for (const v of row) allWeights.push(v);
  }
  if (!allWeights.length) return;

  const bins = 20;
  const min = Math.min(...allWeights), max = Math.max(...allWeights);
  const binW = (max - min) / bins;
  const counts = new Array(bins).fill(0);
  for (const v of allWeights) {
    const b = Math.min(bins - 1, Math.floor((v - min) / binW));
    counts[b]++;
  }
  const maxC = Math.max(...counts);
  const bw = w / bins;

  cx.clearRect(0, 0, w, h);
  for (let i = 0; i < bins; i++) {
    const bh = (counts[i] / maxC) * (h - 6);
    const center = (i / bins) + 0.5/bins;
    const col = center < 0.5
      ? `rgba(255,77,109,${0.4 + center})`
      : `rgba(0,212,255,${0.4 + (1-center)})`;
    cx.fillStyle = col;
    cx.fillRect(i * bw + 1, h - bh - 3, bw - 2, bh);
  }

  // Zero line
  const zeroX = ((0 - min) / (max - min)) * w;
  cx.strokeStyle = 'rgba(255,255,255,0.2)';
  cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(zeroX, 0); cx.lineTo(zeroX, h); cx.stroke();
}

// ═══════════════════════════════════════════════════════
// LAYER LIST UI
// ═══════════════════════════════════════════════════════
function renderLayerList() {
  const list = document.getElementById('layer-list');
  list.innerHTML = '';
  state.layers.forEach((layer, i) => {
    const div = document.createElement('div');
    div.className = 'layer-item' + (state.selectedLayer === i ? ' selected' : '');
    div.innerHTML = `
      <div class="layer-dot" style="background:${layer.color}"></div>
      <div class="layer-info">
        <div class="layer-name">${layer.name}</div>
        <div class="layer-nodes">${layer.nodes} units · ${layer.type}</div>
      </div>
      ${layer.type === 'hidden' ? `<button class="layer-del" onclick="removeLayer(${i},event)" title="Remove">✕</button>` : ''}
    `;
    div.onclick = () => selectLayer(i);
    list.appendChild(div);
  });

  // Update param count
  let params = 0;
  for (let i = 0; i < state.layers.length - 1; i++) {
    params += state.layers[i].nodes * state.layers[i+1].nodes + state.layers[i+1].nodes;
  }
  document.getElementById('param-display').textContent = params.toLocaleString();
}

function selectLayer(i) {
  state.selectedLayer = state.selectedLayer === i ? null : i;
  renderLayerList();
}

function addLayer() {
  const insertIdx = state.layers.length - 1;
  const n = [4, 6, 8, 10, 12][Math.floor(Math.random() * 5)];
  const color = LAYER_COLORS[insertIdx % LAYER_COLORS.length];
  state.layers.splice(insertIdx, 0, {
    type: 'hidden', nodes: n,
    color, name: `Hidden ${insertIdx}`
  });
  initWeights(); renderLayerList(); updateActLegend(); showNotif(`Added hidden layer (${n} units)`);
}

function removeLayer(i, e) {
  e.stopPropagation();
  if (state.layers[i].type !== 'hidden') return;
  state.layers.splice(i, 1);
  initWeights(); renderLayerList(); updateActLegend();
}

// ═══════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════
const BS_MAP = [4,8,16,32,64,128,256,512];
const SPEED_LABELS = ['Slow','Normal-','Normal','Fast','Turbo'];

function updateLR(v) {
  state.lr = (v / 1000).toFixed(4);
  document.getElementById('lr-val').textContent = state.lr;
}
function updateBS(v) {
  state.batchSize = BS_MAP[v-1];
  document.getElementById('bs-val').textContent = state.batchSize;
}
function updateSpeed(v) {
  state.speed = parseInt(v);
  document.getElementById('spd-val').textContent = SPEED_LABELS[v-1];
  if (state.training) startTrainingTick();
}
function setActivation(a) {
  state.activation = a;
  document.querySelectorAll('#act-group .select-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().startsWith(a.slice(0,4)));
  });
  updateActLegend();
}
function setLoss(l) {
  state.lossType = l;
  document.querySelectorAll('#loss-group .select-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().startsWith(l.slice(0,3)));
  });
}

function resetNetwork() {
  state.epoch = 0; state.loss = null; state.acc = null;
  state.lossHistory = []; state.accHistory = []; state.gradHistory = [];
  state.forwardPulse = null;
  document.getElementById('ep-display').textContent   = '0';
  document.getElementById('loss-display').textContent = '—';
  document.getElementById('acc-display').textContent  = '—';
  document.getElementById('m-loss').textContent = '—';
  document.getElementById('m-acc').textContent  = '—';
  document.getElementById('m-grad').textContent = '—';
  document.getElementById('prog-bar').style.width = '0%';
  initWeights(); randomizeActivations();
  showNotif('↺ Weights reset (Xavier init)');
}

// ═══════════════════════════════════════════════════════
// PRESETS
// ═══════════════════════════════════════════════════════
const PRESETS = {
  xor:      [[4,'Input','#00d4ff'],[4,'Hidden 1','#7c3aed'],[2,'Output','#00f5a0']],
  deep:     [[3,'Input','#00d4ff'],[16,'H1','#7c3aed'],[12,'H2','#f59e0b'],[8,'H3','#ff4d6d'],[4,'H4','#00f5a0'],[2,'Output','#00d4ff']],
  wide:     [[6,'Input','#00d4ff'],[32,'Hidden','#7c3aed'],[3,'Output','#00f5a0']],
  autoenc:  [[8,'Input','#00d4ff'],[6,'Enc 1','#7c3aed'],[3,'Bottleneck','#f59e0b'],[6,'Dec 1','#ff4d6d'],[8,'Output','#00f5a0']],
};

function loadPreset(key) {
  const p = PRESETS[key];
  state.layers = p.map((d, i) => ({
    nodes: d[0], name: d[1], color: d[2],
    type: i === 0 ? 'input' : i === p.length-1 ? 'output' : 'hidden'
  }));
  resetNetwork(); renderLayerList(); updateActLegend();
  showNotif(`Loaded preset: ${key}`);
}

// ═══════════════════════════════════════════════════════
// ACTIVATION LEGEND
// ═══════════════════════════════════════════════════════
const ACT_INFO = {
  relu:    { color: '#00d4ff',  formula: 'max(0, x)' },
  tanh:    { color: '#7c3aed', formula: '(eˣ-e⁻ˣ)/(eˣ+e⁻ˣ)' },
  sigmoid: { color: '#f59e0b', formula: '1/(1+e⁻ˣ)' },
  leaky:   { color: '#ff4d6d', formula: 'max(0.1x, x)' },
};

function updateActLegend() {
  const el = document.getElementById('act-legend');
  el.innerHTML = Object.entries(ACT_INFO).map(([name, info]) => `
    <div class="act-item ${state.activation === name ? 'selected' : ''}" onclick="setActivation('${name}')">
      <div class="act-dot" style="background:${info.color}"></div>
      <span class="act-name" style="color:${info.color}">${name.toUpperCase()}</span>
      <span class="act-formula">${info.formula}</span>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════
// NET INFO
// ═══════════════════════════════════════════════════════
function updateNetInfo() {
  let params = 0, biasP = 0;
  for (let i = 0; i < state.layers.length - 1; i++) {
    params += state.layers[i].nodes * state.layers[i+1].nodes;
    biasP  += state.layers[i+1].nodes;
  }
  document.getElementById('net-info').innerHTML = `
    Depth: ${state.layers.length} layers<br>
    Weight params: ${params.toLocaleString()}<br>
    Bias params: ${biasP.toLocaleString()}<br>
    Total params: ${(params+biasP).toLocaleString()}<br>
    Optimizer: SGD<br>
    Init: Xavier/Glorot
  `;
}
